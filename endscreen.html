
<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game afgelopen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="body">

            <header>
                <nav>
                    <ul class="links">
                        <h1 class="title">4Real</h1>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="blur.html">Blur mode</a></li>
                        <li><a href="zoom.html">Zoom mode</a></li>
                <img class="cat" src="img-folder/4real-cat.png" alt="4Real logo">
                    </ul>
                </nav>
            </header>
    <main class="result-container" id="resultScreen">
        <h1>🎉 Game afgelopen!</h1>
        <p class="subtitle">Goed gespeeld! Dit is jouw resultaat.</p>

        <section class="score-card">
            <p class="label">Jouw eindscore</p>
            <p class="score" id="finalScore">0</p>
            <p id="resultSummary" class="subtitle"></p>
        </section>

        <form id="leaderboard-form" class="leaderboard-form">
            <label for="leaderboard-name">Zet je score op de Top 10:</label>
            <input id="leaderboard-name" name="name" type="text" maxlength="20" required>
            <button type="submit" class="endscreen-btn">Score opslaan</button>
        </form>
        <p id="leaderboard-message" aria-live="polite"></p>
        <section class="leaderboard">
            <h2>Top 10</h2>
            <p class="leaderboard-note">Scores saved in this browser</p>
            <table>
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Name</th>
                        <th scope="col">Points</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-entries"></tbody>
            </table>
        </section>

        <div class="buttons">
            <button id="playAgainBtn" class="mode-btn endscreen-btn">Opnieuw spelen</button>
            <button id="homeBtn" class="mode-btn endscreen-btn">
                Terug naar homepage
            </button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
