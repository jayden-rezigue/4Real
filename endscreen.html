
<!DOCTYPE html>
<html lang="nl">

    <link rel="stylesheet" href="style.css">
</head>
<body class="body">

            <header>
                <nav>
                    <ul class="links">

    <main class="result-container" id="resultScreen">
        <h1>🎉 Game afgelopen!</h1>
